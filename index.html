<!doctype html>
<html lang="ng" class="antialiased scroll-smooth" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    
    <!-- Viewport optimized for 2026 OLED & Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>EduAsas - Next-Gen AI-Powered Multi-School Management Platform</title>
    <meta name="title" content="EduAsas - Next-Gen AI-Powered Multi-School Management Platform" />
    <meta name="description" content="The ultimate AI-driven multi-school management system. Engineered for high-performance, EduAsas provides an industrial-grade, end-to-end digital infrastructure for modern educational institutions in Tanzania. Secure, scalable, and lightning-fast." />
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="128x128" href="/icons/logo-128.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/icons/logo-256.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icons/logo-512.png" />
    
    <!-- Apple Web App Settings -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="EduAsas" />

    <!-- OpenGraph / Social Media Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://eduasas.co.tz" />
    <meta property="og:title" content="EduAsas" />
    <meta property="og:description" content="The ultimate AI-driven multi-school management platform." />
    <meta property="og:image" content="/icons/logo-512.png" />

    <!-- Theme Color for browsers -->
    <meta name="theme-color" content="#0F172A" />
  </head>
  <body class="min-h-screen text-slate-800 overflow-x-hidden font-sans selection:bg-blue-300 selection:text-white">
    <!-- EduAsas App contents -->
    <div id="eduasas-app-contents"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
